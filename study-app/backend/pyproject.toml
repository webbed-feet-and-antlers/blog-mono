[project]
name = "study-app-backend"
version = "0.1.0"
description = "AI study tools backend — agent-driven notes, quizzes, flashcards"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "fsrs>=6.0",
    "pymupdf>=1.24",
    "pydub>=0.25",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # evals (backend/evals/) — DeepEval harness + dataset loaders + metrics
    "deepeval>=3.0",
    "datasets>=3.0",
    "rouge-score>=0.1.2",
    "rapidfuzz>=3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session — mirrors production (module-level
# asyncio primitives like the memory blob lock bind to the running loop).
asyncio_default_test_loop_scope = "session"
asyncio_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    # Dataset-backed evaluation suites — run explicitly with
    # `uv run pytest evals/ -m evals` after `task study-app:evals-prepare`.
    "evals: public-dataset evaluation suites (see evals/README.md)",
]

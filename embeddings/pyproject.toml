[project]
name = "embeddings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
mteb = [
    "httpx[http2]>=0.27",
    "datasets>=2.18",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]
evaluate-api = [
    "openai>=1.40",
    "google-genai>=0.5",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
]
evaluate-local = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
]
evaluate-all = [
    "embeddings[evaluate-api,evaluate-local]",
]
leaderboard = [
    "streamlit>=1.36",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
include = ["mteb*", "modules*"]

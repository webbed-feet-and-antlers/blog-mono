[models]
# Newest Sonnet at publish time; cheaper than 4.6. For max prose quality:
#   draft = "~anthropic/claude-opus-latest"   (~2.5x cost)
draft = "anthropic/claude-sonnet-5"
# Must return chat-completions logprobs (probed 2026-09). Anthropic models
# never expose logprobs; the OpenAI -latest family does.
scorer = "~openai/gpt-mini-latest"
# Embeddings for the semantic-glide gate (verified live on OpenRouter).
embedder = "openai/text-embedding-3-small"
# Optional second observer for cross-model corroboration (any family, no
# logprobs needed). Empty = disabled. Try e.g. "google/gemini-2.5-flash".
observer = ""

[sampling]
architect_temp = 0.2
stylist_temp = 0.9
stylist_top_p = 0.92
editor_temp = 0.15

[thresholds]
sentence_sd_min = 8.0
sentence_variance_min = 15.0
transition_density_max = 0.15
em_dash_per_1k_max = 6.0
banned_hits_max = 0
deep_syntax_min_per_block = 1
# Continuation-predictability gate (see scoring/surprisal.py). Primary
# signal: blind-continuation surprisal in bits (observed ~0.6 on generic
# AI-slop prose vs ~1.1 on distinctive human prose). Overlap is only the
# fallback when the scorer returns no logprobs. Calibrate against your own
# posts: uv run wa score x.md --calibrate-dir references/
continuation_overlap_max = 0.55
continuation_bits_max = 0.9
# Multi-sample convergence: 3 blind samples at temperature 0.8; flag when
# they agree on >= 50% of tokens (Fast-DetectGPT curvature, adapted).
continuation_convergence_max = 0.5
# Tier 1: cross-section redundancy (4-gram Jaccard between section pairs)
# and doc-level surprisal SD across blocks (needs >= 4 scored blocks).
redundancy_jaccard_max = 0.25
surprisal_sd_min = 0.15
# Semantic glide: adjacent-section embedding distance needs at least one
# dip below this (humans introduce shifts; models elaborate smoothly).
semantic_step_min = 0.12
observer_corroboration_min = 0.5
max_revisions = 3
# Discourse-shape gate (StoryScope, arXiv:2604.03136). Summary/lesson
# markers are banned outright; docs >= 400 words need temporal texture and
# at least one unresolved trade-off; judge axes flag at 0.7.
temporal_markers_min_per_1k = 0.5
unresolved_min = 1
top5_share_max = 0.18
judge_flag_at = 0.7

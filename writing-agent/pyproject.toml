[project]
name = "writing-agent"
version = "0.1.0"
description = "Anti-slop technical writing agent harness — LangGraph pipeline + deterministic prose linters + collaborative web editor"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
wa = "writing_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_agent"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

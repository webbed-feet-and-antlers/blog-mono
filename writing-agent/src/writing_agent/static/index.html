<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>writing-agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
</head>
<body>
  <header>
    <h1>✍️ writing-agent</h1>
    <div class="header-actions">
      <span id="save-state"></span>
      <button id="btn-revert" hidden title="Revert the last AI edit">↩ Revert AI edit</button>
      <button id="btn-save">Save ⌘S</button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <button id="btn-new" class="primary">＋ New draft with agent</button>
      <form id="new-draft" hidden>
        <label>Topic
          <input name="topic" required placeholder="Why our indexer collapsed">
        </label>
        <label>Research notes
          <textarea name="research" rows="7" placeholder="paste raw notes, numbers, commands, postmortems…"></textarea>
        </label>
        <label>Persona
          <select name="persona">
            <option value="default">default (human &amp; messy)</option>
          </select>
        </label>
        <button type="submit" class="primary">Run agent</button>
      </form>

      <h2>Drafts</h2>
      <ul id="draft-list"></ul>
    </aside>

    <main id="editor-pane">
      <textarea id="editor"></textarea>
    </main>

    <aside id="panel">
      <div id="agent-status" hidden>
        <span class="spinner"></span>
        <span id="agent-stage"></span>
      </div>

      <div class="panel-actions">
        <button id="btn-lint" title="Deterministic linters — no API needed">Lint</button>
        <button id="btn-score" title="Surprisal audit via OpenRouter logprobs">Surprisal</button>
        <button id="btn-shape" title="StoryScope-style discourse shape audit">Shape</button>
        <button id="btn-graph" title="Radar + narrative-space graph vs your references and an AI control">Graph</button>
        <button id="btn-fix" class="primary" title="Rewrite only the blocks failing the gates">AI fix</button>
      </div>

      <div id="charts" hidden>
        <canvas id="rarity" height="200"></canvas>
        <canvas id="scatter" height="200"></canvas>
        <canvas id="radar" height="240"></canvas>
        <p id="judge-line" class="hint"></p>
      </div>

      <pre id="scorecard">Run the gates or the agent — results land here.</pre>
      <div id="flagged-list"></div>

      <h2>Co-editor</h2>
      <div id="chat-log">
        <p class="hint">Type an instruction. Select text in the editor to revise just that passage — otherwise it applies to the whole document. ⌘⏎ to send.</p>
      </div>
      <textarea id="instruction" rows="3" placeholder="e.g. make the intro punchier; add a failing command example to section 2; this reads like marketing, cut it down"></textarea>
      <button id="btn-revise" class="primary">Send ⌘⏎</button>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

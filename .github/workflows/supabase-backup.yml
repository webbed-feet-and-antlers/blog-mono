name: Supabase backup

# Weekly logical backup of the study-app database. Neither Supabase nor
# Neon include automated backups on free tiers, so this is the safety net:
# pg_dump → gzip → private workflow artifact (90-day retention).
#
# Setup (once, after creating the Supabase project):
#   repo variable:  SUPABASE_PROJECT_REF              (gates this workflow)
#   repo secret:    SUPABASE_DB_URL_DIRECT            (session/direct
#                   pooler string, port 5432 — pg_dump needs a session,
#                   not the transaction pooler the app uses)
# Until SUPABASE_PROJECT_REF is set this workflow does nothing.

on:
  schedule:
    - cron: "30 8 * * 1" # Mondays 08:30 UTC, after the keepalive ping
  workflow_dispatch:

jobs:
  pg_dump:
    runs-on: ubuntu-latest
    if: vars.SUPABASE_PROJECT_REF != ''
    steps:
      - name: Dump the database
        run: |
          mkdir -p backup
          pg_dump --no-owner --no-privileges \
            --dbname "${{ secrets.SUPABASE_DB_URL_DIRECT }}" \
            | gzip > "backup/study-app-$(date -u +%Y-%m-%d).sql.gz"
          ls -lh backup/
      - uses: actions/upload-artifact@v4
        with:
          name: study-app-db-${{ github.run_id }}
          path: backup/
          retention-days: 90

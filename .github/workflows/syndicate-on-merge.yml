name: Syndicate (on merge)

# Option 3 — automatic LIVE publish when a PR labeled 'publish' is merged to main.
# No label (or a close-without-merge) = nothing happens. The label is the explicit
# opt-in, so everyday merges that touch blogs (e.g. copy fixes) never post.
#
# Loop prevention: this workflow's commit step writes syndication IDs back into
# blogs/*.mdx, which would re-trigger the preview workflow. The commit message
# carries '[skip preview]' and syndicate-preview.yml's job-level `if` skips on it.
#
# Create the label once (repo owner):
#   gh label create publish --description "Merge publishes this blog to all platforms" --color F59E0B
#
# Relationship to the other two workflows:
#   - syndicate.yml          — manual workflow_dispatch (post on demand)
#   - syndicate-preview.yml  — auto dry-run on blog push to main
#   - syndicate-on-merge.yml — THIS file (auto publish on labeled-PR merge)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write # to commit syndication IDs back into blog frontmatter

# Shares the `syndicate` group with the manual workflow so a manual publish and
# an auto publish can't run concurrently (prevents double-posting). Serial, no cancel.
concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    # Only publish when the PR was actually merged AND carries the 'publish' label.
    # A plain close, or a merge without the label, skips this job (shows gray, not red).
    if: ${{ github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'publish') }}
    runs-on: ubuntu-latest
    # Gates all platform secrets behind the same environment as the manual workflow.
    environment: syndication
    steps:
      # Check out MAIN explicitly, not the PR head. The default checkout for a
      # pull_request event lands on the PR's ref, and the auto-commit step
      # below would then try to push the syndication IDs to the PR branch —
      # which may already be deleted by delete-pr-branch.yml (that race once
      # failed this workflow with "fatal: invalid reference"). The merged
      # content is on main by the time this job runs, which is also where
      # the IDs belong.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Setup Playwright (cache by lockfile)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('site/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: ./site
        run: npx playwright install --with-deps chromium

      - name: Build site (emits the screenshot harness routes)
        working-directory: ./site
        run: npm run build

      - name: Syndicate
        working-directory: ./site
        run: |
          node scripts/syndicate.mjs --dry-run=false
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://inkpens.tech' }}
          PUBLIC_OG_BASE_URL: ${{ vars.PUBLIC_OG_BASE_URL }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          # Medium and Substack are manual platforms (no clean API) — no secrets.
          # The syndication-package artifact they produce is uploaded below for paste.

      # Always upload the manual syndication packages (Medium + Substack) and
      # any per-run output, even if the run fails, so the manual platforms can
      # be pasted by hand from a single download.
      - name: Upload syndication packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndication-packages
          path: site/.syndication-output/
          if-no-files-found: ignore
          retention-days: 14

      # Record returned IDs back into frontmatter AND commit the auto-generated
      # component screenshots (they live in public/sshot and are served by Pages
      # — they must be permanent since dev.to/Medium hotlink rather than re-host).
      # (No `if:` — the job is already gated on merged + publish label, and
      # this workflow is always live.)
      #
      # main is protected ("changes must be made through a pull request") and —
      # empirically — no CI credential (GITHUB_TOKEN, fine-grained or classic
      # PAT as the owner) is granted the ruleset bypass, only the owner's local
      # git credential is. So the record-commit lands on the UNPROTECTED
      # chore/syndicate-records branch, and `task posse:merge-records` merges
      # it into main locally with working credentials (one command, part of the
      # post-publish flow in docs/syndication.md). Posting NEVER depends on
      # this step — on failure it warns and the run stays green.
      - name: Record syndication IDs + screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d blogs ] && git add blogs
          [ -d site/public/sshot ] && git add site/public/sshot
          if git diff --cached --quiet; then
            echo "Nothing to record."
            exit 0
          fi
          git commit -m "chore(syndicate): record cross-post IDs + screenshots"
          if git push --force origin HEAD:refs/heads/chore/syndicate-records; then
            echo "::notice::Syndication records pushed to the chore/syndicate-records branch. Merge locally with: task posse:merge-records"
          else
            echo "::warning::Could not push the syndication-records branch — IDs are in this run's log; re-record them manually if needed."
          fi

name: Syndicate

# POSSE (Post Own Site, Syndicate Everywhere): cross-posts essays to dev.to,
# Bluesky, Mastodon, X (via Buffer), Medium, and emits a Substack teaser.
# Manual trigger only — posting is outward-facing, so it never runs on push.
# The dry-run input defaults to TRUE so you can preview before posting.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — preview payloads, post nothing, commit nothing"
        type: boolean
        default: true
      essay:
        description: "Essay slug to force (re)syndicate; empty = all unpublished"
        required: false
        default: ""

permissions:
  contents: write # to commit syndication IDs back into essay frontmatter

# Don't cancel a cross-post in flight; serial runs avoid double-posting.
concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    # Gates all platform secrets behind a single environment you can require
    # manual approval for, and protect with required reviewers.
    environment: syndication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Setup Playwright (cache by lockfile)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('site/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: ./site
        run: npx playwright install --with-deps chromium

      - name: Build site (emits the screenshot harness routes)
        working-directory: ./site
        run: npm run build

      - name: Syndicate
        working-directory: ./site
        run: |
          node scripts/syndicate.mjs \
            --dry-run=${{ inputs.dry_run }} \
            --essay=${{ inputs.essay }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://webbed-feet-and-antlers.github.io/blog-mono' }}
          # Public origin where OG images are served (for Buffer/X image attachment).
          # Leave unset to skip X image (text thread still posts).
          PUBLIC_OG_BASE_URL: ${{ vars.PUBLIC_OG_BASE_URL }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_TOKEN_ISSUED: ${{ secrets.LINKEDIN_TOKEN_ISSUED }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          MEDIUM_USER_ID: ${{ secrets.MEDIUM_USER_ID }}

      # Always upload the Substack teasers + OG images, even if the run fails,
      # so you can paste Substack manually and reuse the OG images.
      - name: Upload syndication output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndication-output
          path: site/.syndication-output/
          if-no-files-found: ignore
          retention-days: 14

      # Record returned IDs back into frontmatter AND commit the auto-generated
      # component screenshots (they live in public/sshot and are served by Pages
      # — they must be permanent since dev.to/Medium hotlink rather than re-host).
      # Skipped on dry-run. workflow_dispatch-only, so the commit won't retrigger.
      - name: Commit syndication IDs + screenshots
        if: ${{ inputs.dry_run == false }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(syndicate): record cross-post IDs + screenshots"
          file_pattern: "essays/*.mdx essays/*.md site/public/sshot/*.png"

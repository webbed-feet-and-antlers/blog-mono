name: Syndicate

# POSSE (Post Own Site, Syndicate Everywhere): cross-posts blogs to dev.to,
# Bluesky, Mastodon, X (via Buffer), LinkedIn (via Buffer), and packages
# Medium + Substack + LinkedIn Articles + Indie Hackers as manual-paste
# artifacts (no posting APIs exist; locally they run in assisted-draft mode
# via `task posse:login`, but CI has no browser sessions, so here they stay
# manual). Manual trigger only — posting is outward-facing, so it never runs
# on push. The dry-run input defaults to TRUE so you can preview before
# posting.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — preview payloads, post nothing, commit nothing"
        type: boolean
        default: true
      blog:
        description: "Blog slug to scope to; empty = all unpublished (already-posted platforms still skip)"
        required: false
        default: ""
      force:
        description: "Force — re-post/re-draft every platform for the selected blog"
        type: boolean
        default: false

permissions:
  contents: write # to commit syndication IDs back into blog frontmatter

# Don't cancel a cross-post in flight; serial runs avoid double-posting.
concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    # Gates all platform secrets behind a single environment you can require
    # manual approval for, and protect with required reviewers.
    environment: syndication
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Setup Playwright (cache by lockfile)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('site/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: ./site
        run: npx playwright install --with-deps chromium

      - name: Build site (emits the screenshot harness routes)
        working-directory: ./site
        run: npm run build

      - name: Syndicate
        working-directory: ./site
        run: |
          node scripts/syndicate.mjs \
            --dry-run=${{ inputs.dry_run }} \
            --blog=${{ inputs.blog }} \
            --force=${{ inputs.force }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://inkpens.tech' }}
          # Public origin where OG images are served (for Buffer/X image attachment).
          # Leave unset to skip X image (text thread still posts).
          PUBLIC_OG_BASE_URL: ${{ vars.PUBLIC_OG_BASE_URL }}
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          # Medium/Substack/LinkedIn Articles/Indie Hackers are assisted-draft
          # platforms (no clean API) — no secrets; sessions are local-only.
          # The syndication-package artifact they produce is uploaded below for paste.

      # Always upload the manual syndication packages (the no-API platforms)
      # and any per-run output, even if the run fails, so those platforms can
      # be pasted by hand from a single download.
      - name: Upload syndication packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndication-packages
          path: site/.syndication-output/
          if-no-files-found: ignore
          retention-days: 14

      # Record returned IDs back into frontmatter AND commit the auto-generated
      # component screenshots (they live in public/sshot and are served by Pages
      # — they must be permanent since dev.to/Medium hotlink rather than re-host).
      # Skipped on dry-run. workflow_dispatch-only, so the commit won't retrigger.
      #
      # main is protected ("changes must be made through a pull request"), which
      # rejects pushes from the job's GITHUB_TOKEN — so the push authenticates as
      # the owner via SYNDICATE_PAT. Must be a CLASSIC PAT with the `repo` scope:
      # classic tokens fully impersonate the user (repo admin → ruleset bypass),
      # while fine-grained PATs do NOT match role-based bypass actors and get
      # GH013-rejected despite having Contents write. Create once, then:
      #   gh secret set SYNDICATE_PAT --env syndication
      # Posting NEVER depends on this step: without the PAT it posts fine and
      # only the record-commit is skipped, with a warning pointing here.
      - name: Commit syndication IDs + screenshots
        if: ${{ inputs.dry_run == false }}
        env:
          PAT: ${{ secrets.SYNDICATE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::SYNDICATE_PAT is not set — posts went out, but recording IDs/screenshots to protected main was skipped. Create a classic PAT (repo scope) and run: gh secret set SYNDICATE_PAT --env syndication"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # Diagnostics (identity + scopes only — never the token): shows how
          # GitHub's rulesets see the push principal when GH013s happen.
          echo "Push principal: $(curl -s -w '\nhttp=%{http_code}\n' -H "Authorization: token ${PAT}" https://api.github.com/user | grep -E '\"login\"|http=' | tr -d ' ' | tr '\n' ' ') scopes=$(curl -s -I -H "Authorization: token ${PAT}" https://api.github.com/user | grep -i '^x-oauth-scopes' | tr -d '\r' || echo 'none (fine-grained token?)')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d blogs ] && git add blogs
          [ -d site/public/sshot ] && git add site/public/sshot
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(syndicate): record cross-post IDs + screenshots [skip preview]"
          git pull --rebase origin main
          git push origin HEAD:main

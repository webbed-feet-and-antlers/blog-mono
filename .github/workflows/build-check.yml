name: Build check

# Type-checks and builds the site on PRs and on any branch push, so broken
# code is caught before it reaches main. Does NOT deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main] # main is covered by deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Type check
        working-directory: ./site
        run: npm run check

      - name: Build
        working-directory: ./site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

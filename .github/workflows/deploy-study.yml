name: Deploy study app

# Deploys study.inkpens.tech (Fly.io): one container serving the API and
# the built SPA. Requires a `study-app` environment with FLY_API_TOKEN,
# and the repo variable STUDY_CLERK_PUBLISHABLE_KEY (pk_live_… — public
# by design, baked into the frontend bundle at build time).

on:
  push:
    branches: [main]
    paths: ["study-app/**", ".github/workflows/deploy-study.yml"]
  workflow_dispatch:

concurrency:
  group: study-app-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: study-app
    defaults:
      run:
        working-directory: study-app
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: >
          flyctl deploy --remote-only
          --build-arg VITE_CLERK_PUBLISHABLE_KEY="${{ vars.STUDY_CLERK_PUBLISHABLE_KEY }}"

[project]
name = "kg-data"
version = "0.1.0"
description = "Real-grounded synthetic + public data pipeline for temporal knowledge graph extraction"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "datasets>=3.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

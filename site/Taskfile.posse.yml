version: "3"

# POSSE (Post Own Site, Syndicate Everywhere) syndication tasks.
# Pulled in under the `posse:` namespace from the root Taskfile.yml.
#
# Credentials auto-load from site/.env (the npm `syndicate` script uses
# `node --env-file-if-exists=.env`), so no `source .env` is needed locally.
# In CI, secrets are injected directly and there's no .env.
#
# Passing a blog slug: use `--` after the task name, e.g.
#   task posse:dry-run -- posse-syndication
# The slug arrives as {{.CLI_ARGS}}; an empty value means "all unpublished".

tasks:
  dry-run:
    desc: "Preview syndication without posting or committing (slug optional)"
    cmds:
      - npm run syndicate -- --dry-run=true --blog={{.CLI_ARGS}}

  dry-run:build:
    desc: "Build the site, then dry-run syndication (needed for component screenshots)"
    cmds:
      # `npm run build` rather than `task: build` — the posse namespace sets
      # dir: site, so a bare `task: build` would look for posse:build (absent).
      - npm run build
      - npm run syndicate -- --dry-run=true --blog={{.CLI_ARGS}}

  publish:
    desc: "Syndicate for real — one blog (slug required). Posts + commits IDs."
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "A slug is required (e.g. `task posse:publish -- embeddings`). Use posse:publish-all for everything."
    cmds:
      - npm run build
      - npm run syndicate -- --dry-run=false --blog={{.CLI_ARGS}}

  publish-all:
    desc: "Syndicate every unpublished blog for real. Posts + commits IDs. Use with care."
    cmds:
      - npm run build
      - npm run syndicate -- --dry-run=false

  manual:
    desc: "Build the Medium+Substack manual package for one blog and open it ready to paste"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "A slug is required (e.g. `task posse:manual -- posse-syndication`)."
    cmds:
      # Build for component screenshots, syndicate (posts + packages), then open
      # everything in the browser. Safe to re-run: the manual adapters don't
      # write back IDs, and the package dedup keeps files byte-identical.
      - npm run build
      - npm run syndicate -- --dry-run=false --blog={{.CLI_ARGS}}
      - task: open-manual

  open-manual:
    desc: "Open the latest manual package HTML + Medium/Substack editor tabs (internal)"
    internal: true
    vars:
      # SUBSTACK_PUB overrides the publication slug; defaults to "theinkpens".
      SUBSTACK_PUB: theinkpens
    cmds:
      # This task runs with dir: site (set by the root includes:), so the path is
      # relative to site/. `open` is macOS; on Linux swap to `xdg-open`.
      - open ".syndication-output/syndicate-{{.CLI_ARGS}}.html"
      # Medium stories dashboard — "Import a story" is one click from here.
      - open "https://medium.com/me/stories"
      # Substack new-post editor for this publication.
      - open "https://{{.SUBSTACK_PUB}}.substack.com/publish/post"

  ci:dry-run:
    desc: "Trigger the GitHub Actions Syndicate workflow in dry-run mode (slug optional)"
    cmds:
      - >-
        gh workflow run syndicate.yml -f dry_run=true -f blog={{.CLI_ARGS}}

  ci:publish:
    desc: "Trigger the GitHub Actions Syndicate workflow to publish (slug optional)"
    cmds:
      - >-
        gh workflow run syndicate.yml -f dry_run=false -f blog={{.CLI_ARGS}}

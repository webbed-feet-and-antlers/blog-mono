version: "3"

# POSSE (Post Own Site, Syndicate Everywhere) syndication tasks.
# Pulled in under the `posse:` namespace from the root Taskfile.yml.
#
# Credentials auto-load from site/.env (the npm `syndicate` script uses
# `node --env-file-if-exists=.env`), so no `source .env` is needed locally.
# In CI, secrets are injected directly and there's no .env.
#
# Variables:
#   ESSAY  — slug to syndicate one essay (default "" = all unpublished)
#
# Examples:
#   task posse:dry-run
#   task posse:dry-run -- embeddings
#   task posse:publish -- embeddings
#   task posse:publish-all        # no ESSAY = every unpublished essay

vars:
  # Empty string → syndicate.mjs treats essay as undefined → all unpublished.
  ESSAY: ""

tasks:
  dry-run:
    desc: "Preview syndication without posting or committing (ESSAY=slug to scope)"
    cmds:
      - >-
        npm run syndicate -- --dry-run=true --essay={{.ESSAY}}

  dry-run:build:
    desc: "Build the site, then dry-run syndication (needed for component screenshots)"
    cmds:
      - task: build
      - npm run syndicate -- --dry-run=true --essay={{.ESSAY}}

  publish:
    desc: "Syndicate for real — one essay (ESSAY=slug required). Posts + commits IDs."
    preconditions:
      - sh: '[ -n "{{.ESSAY}}" ]'
        msg: "ESSAY is required (e.g. `task posse:publish -- embeddings`). Use posse:publish-all for everything."
    cmds:
      - task: build
      - npm run syndicate -- --dry-run=false --essay={{.ESSAY}}

  publish-all:
    desc: "Syndicate every unpublished essay for real. Posts + commits IDs. Use with care."
    cmds:
      - task: build
      - npm run syndicate -- --dry-run=false

  ci:dry-run:
    desc: "Trigger the GitHub Actions Syndicate workflow in dry-run mode (ESSAY optional)"
    cmds:
      - >-
        gh workflow run syndicate.yml -f dry_run=true -f essay={{.ESSAY}}

  ci:publish:
    desc: "Trigger the GitHub Actions Syndicate workflow to publish (ESSAY optional)"
    cmds:
      - >-
        gh workflow run syndicate.yml -f dry_run=false -f essay={{.ESSAY}}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fountain-pen nib watermark: a large, faint version of the favicon motif.
       Fixed background on <body>. Uses a mid-gray stroke at low opacity so it
       reads as a subtle line drawing on both dark and light backgrounds. -->
  <g fill="none" stroke="#71717a" stroke-width="2.5" stroke-opacity="0.12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Nib body: downward teardrop -->
    <path d="M100 24 C 122 52, 134 76, 134 104 C 134 134, 119 158, 100 166 C 81 158, 66 134, 66 104 C 66 76, 78 52, 100 24 Z" />
    <!-- Center slit -->
    <path d="M100 92 L100 162" />
    <!-- Breathing hole -->
    <circle cx="100" cy="98" r="9" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- constellation: bold connected star figures + a dense scattered field,
       spanning the frame. -->
  <g stroke="{{ACCENT}}" stroke-width="5" opacity="0.85" stroke-linecap="round">
    <!-- primary constellation (upper-right) -->
    <line x1="950" y1="120" x2="1070" y2="200" />
    <line x1="1070" y1="200" x2="1160" y2="110" />
    <line x1="1070" y1="200" x2="1010" y2="330" />
    <line x1="1010" y1="330" x2="1140" y2="420" />
    <line x1="1140" y1="420" x2="1190" y2="300" />
    <line x1="1160" y1="110" x2="1190" y2="300" />
    <line x1="1010" y1="330" x2="880" y2="420" />
    <!-- secondary figure (lower-left) -->
    <line x1="180" y1="450" x2="330" y2="380" />
    <line x1="330" y1="380" x2="460" y2="500" />
    <line x1="460" y1="500" x2="280" y2="560" />
    <line x1="280" y1="560" x2="180" y2="450" />
    <line x1="330" y1="380" x2="540" y2="300" />
    <line x1="540" y1="300" x2="700" y2="380" />
  </g>
  <g fill="{{ACCENT}}">
    <!-- anchor stars (larger, brighter) -->
    <circle cx="1070" cy="200" r="14" opacity="0.95" />
    <circle cx="1010" cy="330" r="14" opacity="0.95" />
    <circle cx="1140" cy="420" r="12" opacity="0.9" />
    <circle cx="540" cy="300" r="12" opacity="0.9" />
    <circle cx="330" cy="380" r="12" opacity="0.9" />
    <!-- small stars in the figures -->
    <circle cx="950" cy="120" r="8" opacity="0.85" />
    <circle cx="1160" cy="110" r="8" opacity="0.85" />
    <circle cx="1190" cy="300" r="8" opacity="0.85" />
    <circle cx="880" cy="420" r="8" opacity="0.8" />
    <circle cx="180" cy="450" r="8" opacity="0.8" />
    <circle cx="460" cy="500" r="8" opacity="0.8" />
    <circle cx="280" cy="560" r="7" opacity="0.75" />
    <circle cx="700" cy="380" r="7" opacity="0.75" />
  </g>
  <!-- dense scattered field (mid-size, fills empty areas) -->
  <g fill="{{ACCENT}}" opacity="0.7">
    <circle cx="760" cy="140" r="6" /><circle cx="640" cy="220" r="5" /><circle cx="820" cy="500" r="6" />
    <circle cx="700" cy="120" r="5" /><circle cx="660" cy="540" r="6" /><circle cx="560" cy="180" r="5" />
    <circle cx="440" cy="180" r="5" /><circle cx="500" cy="560" r="5" /><circle cx="600" cy="460" r="6" />
    <circle cx="840" cy="280" r="5" /><circle cx="1080" cy="560" r="5" /><circle cx="1190" cy="540" r="5" />
  </g>
  <!-- faint dust (smallest, for depth) -->
  <g fill="{{ACCENT}}" opacity="0.45">
    <circle cx="720" cy="260" r="3" /><circle cx="900" cy="220" r="3" /><circle cx="780" cy="380" r="3" />
    <circle cx="620" cy="400" r="3" /><circle cx="400" cy="280" r="3" /><circle cx="500" cy="420" r="3" />
    <circle cx="250" cy="300" r="3" /><circle cx="380" cy="540" r="3" /><circle cx="640" cy="320" r="3" />
    <circle cx="1130" cy="250" r="3" /><circle cx="940" cy="560" r="3" /><circle cx="1100" cy="480" r="3" />
    <circle cx="80" cy="380" r="3" /><circle cx="160" cy="180" r="3" /><circle cx="80" cy="560" r="3" />
  </g>
</svg>

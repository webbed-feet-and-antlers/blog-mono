<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- vectors: dense embedding-space clusters — many points connected by edges,
       filling the frame. -->
  <g stroke="{{ACCENT}}" stroke-width="4" opacity="0.8">
    <!-- primary cluster edges (upper-right) -->
    <line x1="980" y1="150" x2="1090" y2="240" /><line x1="980" y1="150" x2="900" y2="260" />
    <line x1="1090" y1="240" x2="1010" y2="340" /><line x1="900" y1="260" x2="1010" y2="340" />
    <line x1="1010" y1="340" x2="1130" y2="420" /><line x1="900" y1="260" x2="780" y2="340" />
    <line x1="780" y1="340" x2="860" y2="460" /><line x1="1010" y1="340" x2="860" y2="460" />
    <line x1="1130" y1="420" x2="860" y2="460" /><line x1="780" y1="340" x2="660" y2="220" />
    <line x1="660" y1="220" x2="980" y2="150" /><line x1="660" y1="220" x2="540" y2="320" />
    <line x1="540" y1="320" x2="780" y2="340" /><line x1="860" y1="460" x2="720" y2="560" />
    <line x1="1010" y1="340" x2="1180" y2="260" /><line x1="1180" y1="260" x2="1130" y2="420" />
    <line x1="1180" y1="260" x2="1090" y2="240" />
  </g>
  <g fill="{{ACCENT}}" opacity="0.92">
    <circle cx="980" cy="150" r="14" /><circle cx="1090" cy="240" r="12" /><circle cx="900" cy="260" r="16" />
    <circle cx="1010" cy="340" r="12" /><circle cx="1130" cy="420" r="14" /><circle cx="780" cy="340" r="12" />
    <circle cx="860" cy="460" r="18" /><circle cx="660" cy="220" r="12" /><circle cx="540" cy="320" r="10" />
    <circle cx="720" cy="560" r="10" /><circle cx="1180" cy="260" r="10" />
  </g>
  <g stroke="{{ACCENT}}" stroke-width="4" opacity="0.7">
    <!-- secondary cluster edges (lower-left) -->
    <line x1="180" y1="440" x2="300" y2="510" /><line x1="300" y1="510" x2="430" y2="470" />
    <line x1="180" y1="440" x2="260" y2="340" /><line x1="260" y1="340" x2="430" y2="470" />
    <line x1="260" y1="340" x2="400" y2="240" /><line x1="400" y1="240" x2="180" y2="440" />
    <line x1="300" y1="510" x2="120" y2="560" /><line x1="430" y1="470" x2="540" y2="320" />
    <line x1="400" y1="240" x2="540" y2="320" /><line x1="120" y1="560" x2="260" y2="340" />
  </g>
  <g fill="{{ACCENT}}" opacity="0.85">
    <circle cx="180" cy="440" r="12" /><circle cx="300" cy="510" r="10" /><circle cx="430" cy="470" r="13" />
    <circle cx="260" cy="340" r="10" /><circle cx="400" cy="240" r="11" /><circle cx="120" cy="560" r="9" />
  </g>
</svg>

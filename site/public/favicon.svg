<svg xmlns="http://www.w3.org/2000/svg" viewBox="686.5 361 200 200" width="200" height="200">
  <!--
    Fountain-pen nib (hand-drawn). The stroke colour is driven by an embedded
    CSS media query, NOT currentColor: favicons load as image resources with no
    page CSS context, so currentColor resolves to black and is invisible on a
    dark browser tab. prefers-color-scheme (supported in Chromium + Firefox)
    swaps the stroke so it's visible on both light and dark browser chrome.
  -->
  <style>
    .nib { stroke: #27272a; }              /* zinc-800 — light browser chrome (default) */
    @media (prefers-color-scheme: dark) {
      .nib { stroke: #e4e4e7; }            /* zinc-200 — dark browser chrome */
    }
  </style>
